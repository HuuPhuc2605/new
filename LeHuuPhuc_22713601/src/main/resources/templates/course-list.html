<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Courses</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="p-4 bg-gray-100">

<!-- HEADER -->
<div class="flex justify-between mb-3">
    <h1 class="font-bold text-xl">Courses</h1>

    <div>
        Xin chào <b th:text="${name}"></b>

        <form th:action="@{/logout}" method="post" style="display:inline">
            <button class="text-red-600 ml-2">Logout</button>
        </form>
    </div>
</div>

<!-- ADD -->
<div th:if="${roleName.contains('ADMIN')}" class="mb-2">
    <a th:href="@{/courses/form}" class="text-green-600">Thêm mới</a>
</div>

<!-- SEARCH -->
<form th:action="@{/courses}" method="get" class="mb-3">
    <input name="keyword" th:value="${keyword}" placeholder="Search..."
           class="border p-1">
    <button class="bg-blue-500 text-white px-2 py-1">OK</button>
    <a th:href="@{/courses}" class="ml-2 text-blue-600">Reset</a>
</form>

<!-- LIST -->
<div class="grid grid-cols-1 md:grid-cols-3 gap-3">

    <div th:each="course : ${courses}"
         class="bg-white p-3 shadow">

        <img th:src="${course.imageUrl}" class="h-32 w-full object-cover mb-2">

        <b th:text="${course.name}"></b><br>
        <small th:text="${course.instructor}"></small><br>
        <small th:text="${course.category}"></small>

        <!-- ACTION -->
        <div th:if="${roleName.contains('ADMIN')}" class="mt-2">
            <a th:href="@{/courses/form(id=${course.id})}" class="text-yellow-600">Edit</a>

            <form th:action="@{/courses/delete/{id}(id=${course.id})}"
                  method="post" style="display:inline">
                <button onclick="return confirm('Bạn có chắc xóa không?')"
                        class="text-red-600 ml-2">
                    Delete
                </button>
            </form>
        </div>

    </div>

</div>

</body>
</html>
